name: Auto Update Netflix HK Catalog

on:
  schedule:
    # Runs automatically every day at midnight UTC (8:00 AM HKT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it via a button anytime

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python tmdb_fetcher.py

      - name: Commit & Push Updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add netflix_hk_hybrid_all.json tmdb_metadata_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update netflix_hk_hybrid_all.json and cache [skip ci]" && git push)
