<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix HK Streaming Catalog</title>
  <style>
    :root {
      --bg-color: #141414;
      --card-bg: #1f1f1f;
      --text-color: #ffffff;
      --accent-red: #e50914;
      --subtext-color: #aaaaaa;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--subtext-color);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    /* Control Panel Layout */
    .controls-panel {
      background-color: #181818;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Search Bar Input */
    .search-box {
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #242424;
      color: #fff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-appearance: none;
    }

    .search-input:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 8px rgba(229, 9, 20, 0.4);
    }

    /* Dropdown Filters Grid */
    .filter-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .filter-select {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #242424;
      color: #fff;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .filter-select:focus {
      border-color: var(--accent-red);
    }

    /* Custom Multi-Select Dropdown Styles */
    .multi-select {
      position: relative;
      width: 100%;
    }

    .multi-select-btn {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #242424;
      color: #fff;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .multi-select-btn:hover, .multi-select-btn:focus {
      border-color: var(--accent-red);
    }

    .multi-select-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background-color: #1f1f1f;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      padding: 6px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }

    .multi-select-dropdown.show {
      display: block;
    }

    .multi-select-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #fff;
      border-radius: 4px;
      user-select: none;
    }

    .multi-select-option:hover {
      background-color: #2a2a2a;
    }

    .multi-select-option input {
      accent-color: var(--accent-red);
      cursor: pointer;
    }

    /* Catalog Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--subtext-color);
    }

    /* Catalog Grid Layout */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    @media (min-width: 600px) {
      body {
        padding: 20px;
      }
      .catalog-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
      }
      h1 {
        font-size: 2rem;
      }
    }

    /* Media Cards */
    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      padding-top: 150%;
      background-color: #111;
      min-height: 220px;
    }

    .poster-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .platform-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #fff;
      background-color: var(--accent-red);
      z-index: 2;
    }

    .card-details {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--subtext-color);
      margin-bottom: 8px;
    }

    .rating-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .rating-score {
      font-size: 0.85rem;
      font-weight: bold;
      color: #f3ce13;
    }

    .rating-unrated {
      color: #a0a0a0;
      font-size: 0.75rem;
    }

    .links-group {
      display: flex;
      gap: 6px;
    }

    .external-link {
      color: var(--subtext-color);
      text-decoration: none;
      font-size: 0.75rem;
    }

    .external-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* Styled Netflix Red Link */
    .external-link.netflix-link {
      color: var(--accent-red);
      font-weight: 600;
    }

    .external-link.netflix-link:hover {
      color: #ff2a35;
      text-decoration: underline;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--subtext-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>Netflix Hong Kong Catalog</h1>
    <div class="subtitle">High-performance real-time streaming index</div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <!-- Search Input -->
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="🔍 Search titles by name..."
        />
      </div>

      <!-- Category Filter Dropdowns -->
      <div class="filter-group">
        <!-- 1. Format Filter (Single Select) -->
        <select id="typeSelect" class="filter-select">
          <option value="ALL">All Formats</option>
          <option value="movie">Movies Only</option>
          <option value="series">Series / Shows Only</option>
        </select>

        <!-- 2. Release Year Filter (Multi-Select) -->
        <div class="multi-select" id="yearFilter">
          <button type="button" class="multi-select-btn" onclick="toggleDropdown('yearFilter')">
            <span id="yearBtnText">All Years</span> ▾
          </button>
          <div class="multi-select-dropdown" id="yearDropdownList">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- 3. Genre Filter (Multi-Select) -->
        <div class="multi-select" id="genreFilter">
          <button type="button" class="multi-select-btn" onclick="toggleDropdown('genreFilter')">
            <span id="genreBtnText">All Genres</span> ▾
          </button>
          <div class="multi-select-dropdown" id="genreDropdownList">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- 4. Region / Language Filter (Multi-Select) -->
        <div class="multi-select" id="regionFilter">
          <button type="button" class="multi-select-btn" onclick="toggleDropdown('regionFilter')">
            <span id="regionBtnText">All Regions</span> ▾
          </button>
          <div class="multi-select-dropdown" id="regionDropdownList">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- 5. Sorting Order (Single Select) -->
        <select id="sortSelect" class="filter-select">
          <option value="weighted">Sort by Weighted Score</option>
          <option value="raw">Sort by IMDb Score</option>
          <option value="votes">Sort by Most Voted</option>
          <option value="year">Sort by Newest</option>
        </select>
      </div>
    </div>

    <!-- Active Count Display -->
    <div class="status-bar">
      <span id="resultsCount">Showing 0 titles</span>
      <span id="lastUpdated"></span>
    </div>
  </header>

  <main>
    <div id="catalogGrid" class="catalog-grid">
      <!-- Media cards rendered dynamically via JS -->
    </div>
  </main>

  <script>
    let masterData = [];

    // Helper: Check for TV/Series format
    function checkIfSeries(item) {
      if (item.tmdb_type === 'tv') return true;
      if (item.type && (item.type.toLowerCase() === 'tv' || item.type.toLowerCase() === 'series')) return true;
      if (item.genres && (item.genres.includes('(Series)') || item.genres.toLowerCase().includes('series'))) return true;
      return false;
    }

    // Toggle custom dropdown visibility & close others
    function toggleDropdown(filterId) {
      const container = document.getElementById(filterId);
      const dropdown = container.querySelector('.multi-select-dropdown');

      // Close all other dropdowns
      document.querySelectorAll('.multi-select-dropdown').forEach(d => {
        if (d !== dropdown) d.classList.remove('show');
      });

      dropdown.classList.toggle('show');
    }

    // Close dropdowns when clicking outside
    window.addEventListener('click', function(e) {
      if (!e.target.closest('.multi-select')) {
        document.querySelectorAll('.multi-select-dropdown').forEach(d => d.classList.remove('show'));
      }
    });

    // 1. Fetch JSON Data Array with Cache-Busting
    async function loadCatalog() {
      try {
        const cacheBuster = new Date().getTime();
        const response = await fetch(`netflix_hk_hybrid_all.json?v=${cacheBuster}`);
        if (!response.ok) throw new Error('Failed to load JSON file.');

        masterData = await response.json();

        populateMultiSelects(masterData);
        applyFilters();
      } catch (error) {
        console.error("Catalog Error:", error);
        document.getElementById("catalogGrid").innerHTML = `
          <div class="no-results">
            <h2>Unable to load catalog data</h2>
            <p>Ensure <code>netflix_hk_hybrid_all.json</code> is generated and stored in the same server directory.</p>
          </div>`;
      }
    }

    // 2. Extract and Populate Multi-Select Checkboxes
    function populateMultiSelects(data) {
      const genres = new Set();
      const regions = new Set();
      const years = new Set();

      data.forEach(item => {
        if (item.genres) {
          item.genres.split(',').forEach(g => {
            const cleanGenre = g.replace('(Series)', '').trim();
            if (cleanGenre) genres.add(cleanGenre);
          });
        }
        if (item.region) {
          regions.add(item.region.trim());
        }
        if (item.year && item.year > 0) {
          years.add(item.year);
        }
      });

      populateChecklist("yearDropdownList", Array.from(years).sort((a, b) => b - a), "yearBtnText", "All Years");
      populateChecklist("genreDropdownList", Array.from(genres).sort(), "genreBtnText", "All Genres");
      populateChecklist("regionDropdownList", Array.from(regions).sort(), "regionBtnText", "All Regions");
    }

    function populateChecklist(containerId, items, btnTextId, defaultLabel) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      items.forEach(item => {
        const label = document.createElement("label");
        label.className = "multi-select-option";
        label.innerHTML = `
          <input type="checkbox" value="${item}" onchange="applyFilters(); updateButtonText('${btnTextId}', '${containerId}', '${defaultLabel}')" />
          <span>${item}</span>
        `;
        container.appendChild(label);
      });
    }

    // Update button text to reflect selected counts
    function updateButtonText(btnTextId, containerId, defaultLabel) {
      const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
      const btnText = document.getElementById(btnTextId);

      if (checkboxes.length === 0) {
        btnText.textContent = defaultLabel;
      } else if (checkboxes.length === 1) {
        btnText.textContent = checkboxes[0].value;
      } else {
        btnText.textContent = `${checkboxes.length} selected`;
      }
    }

    // Helper to get checked values from a multi-select container
    function getSelectedValues(containerId) {
      const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]:checked`);
      return Array.from(checkboxes).map(cb => cb.value);
    }

    // 3. Filter and Sort Logic
    function applyFilters() {
      const searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
      const selectedType = document.getElementById("typeSelect").value;
      const selectedYears = getSelectedValues("yearDropdownList");
      const selectedGenres = getSelectedValues("genreDropdownList");
      const selectedRegions = getSelectedValues("regionDropdownList");
      const selectedSort = document.getElementById("sortSelect").value;

      let filtered = masterData.filter(item => {
        const matchesSearch = searchQuery === "" || (item.title && item.title.toLowerCase().includes(searchQuery));

        const isSeries = checkIfSeries(item);
        let matchesType = true;
        if (selectedType === "movie") matchesType = !isSeries;
        if (selectedType === "series") matchesType = isSeries;

        // Year match: true if no years selected, or item's year is in selected list
        const matchesYear = selectedYears.length === 0 || (item.year && selectedYears.includes(item.year.toString()));

        // Genre match: true if no genres selected, or item includes at least one selected genre
        const matchesGenre = selectedGenres.length === 0 || (item.genres && selectedGenres.some(g => item.genres.includes(g)));

        // Region match: true if no regions selected, or item's region is in selected list
        const matchesRegion = selectedRegions.length === 0 || (item.region && selectedRegions.includes(item.region));

        const isNewOrValid = (item.raw_score && item.raw_score > 0) || (item.year && item.year >= 2025);

        return matchesSearch && matchesType && matchesYear && matchesGenre && matchesRegion && isNewOrValid;
      });

      // Sorting Logic
      filtered.sort((a, b) => {
        const scoreA = a.weighted_score || 0;
        const scoreB = b.weighted_score || 0;
        const rawA = a.raw_score || 0;
        const rawB = b.raw_score || 0;
        const votesA = a.votes || 0;
        const votesB = b.votes || 0;
        const yearA = a.year || 0;
        const yearB = b.year || 0;

        if (selectedSort === 'weighted') return scoreB - scoreA;
        if (selectedSort === 'raw') return rawB - rawA;
        if (selectedSort === 'votes') return votesB - votesA;
        if (selectedSort === 'year') return yearB - yearA;
        return 0;
      });

      renderCatalog(filtered);
    }

    // 4. Render Cards into Grid
    function renderCatalog(items) {
      const grid = document.getElementById("catalogGrid");
      const resultsCount = document.getElementById("resultsCount");
      grid.innerHTML = "";

      resultsCount.textContent = `Showing ${items.length} titles`;

      if (items.length === 0) {
        grid.innerHTML = `<div class="no-results">No titles match your active filters.</div>`;
        return;
      }

      items.forEach(item => {
        const posterSrc = item.poster_url || 'https://via.placeholder.com/300x450?text=No+Poster';

        let ratingHtml = '';
        if (item.raw_score && item.raw_score > 0) {
          const voteStr = item.votes ? item.votes.toLocaleString() : '0';
          ratingHtml = `<span class="rating-score">★ ${item.raw_score.toFixed(1)} <small style="font-size:0.65rem; color:#aaa;">(${voteStr})</small></span>`;
        } else {
          ratingHtml = `<span class="rating-unrated">★ New / Unrated</span>`;
        }

        const isSeries = checkIfSeries(item);
        const mediaTypePath = isSeries ? 'tv' : 'movie';
        const tmdbUrl = item.tmdb_id ? `https://www.themoviedb.org/${mediaTypePath}/${item.tmdb_id}` : null;

        // Netflix Link Construction: Uses netflix_id if present, otherwise constructs dynamic search query
        const netflixUrl = item.netflix_id
          ? `https://www.netflix.com/title/${item.netflix_id}`
          : `https://www.netflix.com/search?q=${encodeURIComponent(item.title)}`;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="poster-wrapper">
            <span class="platform-badge">Netflix</span>
            <img class="poster-img" src="${posterSrc}" alt="${item.title || 'Title'}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'" />
          </div>
          <div class="card-details">
            <div>
              <div class="card-title" title="${item.title}">${item.title}</div>
              <div class="card-meta">${item.year || ''} • ${item.genres || 'General'}</div>
            </div>
            <div class="rating-row">
              ${ratingHtml}
              <div class="links-group">
                <a class="external-link netflix-link" href="${netflixUrl}" target="_blank" rel="noopener">Netflix ↗</a>
                ${tmdbUrl ? `<a class="external-link" href="${tmdbUrl}" target="_blank" rel="noopener">TMDB ↗</a>` : ''}
                ${item.imdb_url && item.imdb_url !== "N/A" ? `<a class="external-link" href="${item.imdb_url}" target="_blank" rel="noopener">IMDb ↗</a>` : ''}
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 5. Attach Event Listeners
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("typeSelect").addEventListener("change", applyFilters);
    document.getElementById("sortSelect").addEventListener("change", applyFilters);

    // Initial Execution
    loadCatalog();
  </script>
</body>
</html>
